<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>var() in SVG presentation attributes (Legatus #4)</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>:root{--c:#ff0000} .cls{stroke:#00ff00}</style>
</head>
<body>
<svg width="200" height="40">
  <line id="l-var" x1="0" y1="5" x2="200" y2="5" stroke="var(--c)" stroke-width="2"/>
  <line id="l-cur" x1="0" y1="15" x2="200" y2="15" style="color:#0000ff" stroke="currentColor" stroke-width="2"/>
  <line id="l-cls" class="cls" x1="0" y1="25" x2="200" y2="25" stroke-width="2"/>
  <line id="l-var-style" x1="0" y1="35" x2="200" y2="35" style="stroke:var(--c)" stroke-width="2"/>
</svg>
<script>
"use strict";
test(() => {
  assert_equals(getComputedStyle(document.getElementById("l-var")).stroke, "rgb(255, 0, 0)");
}, "stroke='var(--c)' resolves like the style declaration");

test(() => {
  assert_equals(getComputedStyle(document.getElementById("l-var-style")).stroke, "rgb(255, 0, 0)");
}, "style='stroke:var(--c)' keeps working");

test(() => {
  assert_equals(getComputedStyle(document.getElementById("l-cur")).stroke, "rgb(0, 0, 255)");
  assert_equals(getComputedStyle(document.getElementById("l-cls")).stroke, "rgb(0, 255, 0)");
}, "currentColor and class rules unaffected");
</script>
</body>
</html>
