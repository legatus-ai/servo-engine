<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Native double click selects the word (Legatus #8)</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-actions.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
</head>
<body>
<p id="words">selectable wonderful words for the pointer</p>
<script>
"use strict";
// Drives REAL trusted input through the embedder/WebDriver path (not
// dispatchEvent): two press/release pairs at one pixel, like the Legatus
// pane driver. Regression test for the bug where the word upgrade ran on
// the mouseup/dblclick path whose hit test carries no DOM position, so
// the selection stayed a collapsed caret. The upgrade now runs on the
// second mousedown (detail 2), whose hit test has the DOM position.
promise_test(async () => {
  const t = document.getElementById("words").firstChild;
  // Aim at the end of "words" (offsets 20..25), as in the pane repro.
  const r = document.createRange();
  r.setStart(t, 24);
  r.setEnd(t, 25);
  const rect = r.getBoundingClientRect();
  const x = Math.round(rect.x + rect.width / 2);
  const y = Math.round(rect.y + rect.height / 2);
  await new test_driver.Actions()
    .pointerMove(x, y)
    .pointerDown().pointerUp()
    .pointerDown().pointerUp()
    .send();
  const selection = getSelection();
  assert_equals(selection.toString(), "words", "double click selects the word");
  assert_equals(selection.anchorNode, t, "anchor is the text node");
  assert_equals(selection.anchorOffset, 20, "anchor at word start");
  assert_equals(selection.focusOffset, 25, "focus at word end");
}, "native double click selects the word under the cursor");
</script>
</body>
</html>
