[package]
name = "legatus-check"
version.workspace = true
authors.workspace = true
description = "Legatus standalone build gate: links the engine crates our patches touch, under the workspace stylo patch."
license.workspace = true
edition.workspace = true

[[bin]]
name = "legatus-check"
path = "main.rs"

[dependencies]
fonts = { workspace = true }
layout = { workspace = true }
script = { workspace = true }

# Build-time fork check (see build.rs): resolves against the same Stylo
# as everything else in this workspace, i.e. our path patch when present.
[build-dependencies]
stylo_traits = { workspace = true }

[lints]
workspace = true
