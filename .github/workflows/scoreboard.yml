# Web-compat scoreboard: nightly WPT (fork release, headless, sharded) vs
# upstream Servo vs Chrome, published to the `scoreboard` branch (Pages).
# Nightly + manual only: never runs on pull_request.
name: Web-compat scoreboard

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      wpt-subsets:
        description: "WPT path filters (empty = full suite)"
        default: ""
        required: false
        type: string
      chunks:
        description: "Number of WPT shards"
        default: "4"
        required: false
        type: string

concurrency:
  group: scoreboard
  cancel-in-progress: false

jobs:
  wpt:
    uses: ./.github/workflows/linux.yml
    secrets: inherit
    with:
      profile: release
      wpt: true
      force-github-hosted-runner: true
      number-of-wpt-chunks: ${{ fromJSON(inputs.chunks || '4') }}
      wpt-args: --headless ${{ inputs.wpt-subsets || '' }}

  scoreboard:
    needs: [wpt]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout legatus (generator)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: legatus
          sparse-checkout: scoreboard
          sparse-checkout-cone-mode: false
      - name: Download merged WPT reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wpt-full-logs-linux
          path: wpt-logs
      - name: Fetch scoreboard history
        run: |
          mkdir -p hist
          if git fetch origin scoreboard --depth 30; then
            git archive FETCH_HEAD data | tar -x -C hist || true
          else
            echo "no scoreboard branch yet; starting history"
          fi
      - name: Generate data + page
        run: |
          DATE=$(date -u +%F)
          mkdir -p site/data
          python3 scoreboard/generate.py \
            --date "$DATE" \
            --fork-sha "$GITHUB_SHA" \
            --reports wpt-logs/linux/wptreport/*.json \
            --history-dir hist \
            --out-data "site/data/$DATE.json" \
            --out-html site/index.html
          echo "DATE=$DATE" >> "$GITHUB_ENV"
      - name: Publish to scoreboard branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch origin scoreboard; then
            git checkout -B scoreboard FETCH_HEAD
          else
            git checkout --orphan scoreboard
            git rm -rf . || true
          fi
          mkdir -p data
          cp "site/data/$DATE.json" data/
          cp site/index.html index.html
          git add "data/$DATE.json" index.html
          git commit -m "scoreboard: $DATE" || echo "nothing to commit"
          git push origin scoreboard
