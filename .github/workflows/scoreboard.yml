# Web-compat scoreboard: nightly WPT (fork release, headless, sharded) vs
# upstream Servo vs Chrome, published to the `scoreboard` branch (Pages).
# Registered from main (schedule + dispatch only register on the default
# branch) but builds and tests the `legatus` branch: main needs nothing
# else from us. Nightly + manual only: never runs on pull_request.
# The scorer (scoreboard/generate.py) lives beside this file on main.
name: Web-compat scoreboard

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      wpt-subsets:
        description: "WPT path filters (empty = nightly default: all of css/ plus the extra areas; 'all' = full suite)"
        default: ""
        required: false
        type: string
      chunks:
        description: "Number of WPT shards, 1..20 (empty = nightly default)"
        default: ""
        required: false
        type: string

concurrency:
  group: scoreboard
  cancel-in-progress: false

# Least privilege: read-only by default. Artifact upload/download needs
# `actions: write` (granted per job below); pushing the scoreboard branch
# needs `contents: write` (publish step only).
permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  SHELL: /bin/bash
  GST_PLUGIN_FEATURE_RANK: pulsesink:NONE,alsasink:NONE,jacksink:NONE,fakesink:MAX
  # Nightly default: the whole css/ directory plus the extra areas
  # (selection, editing, range-geometry, downloads, user-activation; see
  # AREAS in scoreboard/generate.py). range-geometry is css/cssom-view,
  # already inside css/.
  NIGHTLY_WPT_SUBSETS: "css selection editing contenteditable html/links FileAPI html/user-activation"
  # About 35.5k test ids. The last run measured ~0.2 s of wall time per test
  # on a 4-core runner, so 16 id_hash shards land around 20-35 minutes each,
  # timeouts included: far from the 6 h job limit and under the 90 min aim.
  NIGHTLY_CHUNKS: "16"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.ids.outputs.chunks }}
      count: ${{ steps.ids.outputs.count }}
      subsets: ${{ steps.ids.outputs.subsets }}
    steps:
      - id: ids
        # Inputs reach the shell only through env (never `${{ }}` in `run:`),
        # then are validated: chunks is an integer 1..20, subsets may only
        # contain path characters, so the later unquoted expansion is safe.
        env:
          CHUNKS: ${{ inputs.chunks || '' }}
          WPT_SUBSETS: ${{ inputs.wpt-subsets || '' }}
        run: |
          CHUNKS=${CHUNKS:-$NIGHTLY_CHUNKS}
          case "$CHUNKS" in
            ''|*[!0-9]*|0*) echo "chunks must be an integer 1..20, got '$CHUNKS'"; exit 1;;
          esac
          if [ "$CHUNKS" -gt 20 ]; then echo "chunks must be 1..20, got '$CHUNKS'"; exit 1; fi
          case "$WPT_SUBSETS" in
            '') WPT_SUBSETS=$NIGHTLY_WPT_SUBSETS;;
            all) WPT_SUBSETS='';;
          esac
          case "$WPT_SUBSETS" in
            *[!A-Za-z0-9_./\ -]*) echo "wpt-subsets has illegal characters: '$WPT_SUBSETS'"; exit 1;;
          esac
          echo "WPT subsets: ${WPT_SUBSETS:-(full suite)}; shards: $CHUNKS"
          echo "chunks=$(seq 1 "$CHUNKS" | jq -R . | jq -s -c 'map(tonumber)')" >> "$GITHUB_OUTPUT"
          echo "count=$CHUNKS" >> "$GITHUB_OUTPUT"
          echo "subsets=$WPT_SUBSETS" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      actions: write
    outputs:
      # The legatus commit that was built. The shards test this exact tree
      # and the page records it, even if legatus moves mid-run.
      sha: ${{ steps.rev.outputs.sha }}
    env:
      # legatus-ai/stylo is private: cargo fetches it with the git CLI over
      # SSH, using the read-only deploy key loaded below.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523
        with:
          tool-cache: false
          large-packages: false
          swap-storage: false
      - name: Checkout legatus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: legatus
      - name: Record legatus commit
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Load stylo deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.STYLO_DEPLOY_KEY }}
      - name: Fetch private stylo fork over SSH
        # Cargo.toml keeps the https URL for local builds; rewrite it here.
        run: git config --global url."git@github.com:legatus-ai/stylo".insteadOf "https://github.com/legatus-ai/stylo"
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm
      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=${LLVM_PATH}/lib" >> $GITHUB_ENV
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Bootstrap dependencies
        timeout-minutes: 30
        run: |
          sudo apt update
          ./mach bootstrap --yes --skip-lints --skip-nextest
          # FIXME #41043, #41044
          sudo apt install -qy --no-install-recommends mesa-vulkan-drivers fonts-noto-cjk fonts-dejavu-extra
          # FIXME #35029
          sudo apt purge -y fonts-droid-fallback
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Enable sccache
        run: |
          {
            echo "SCCACHE_GHA_VERSION=${{ vars.SCCACHE_GHA_VERSION || '1' }}"
            echo "SCCACHE_GHA_ENABLED=true"
            echo "RUSTC_WRAPPER=sccache"
            echo "CARGO_INCREMENTAL=0"
          } >> $GITHUB_ENV
      - name: Build release
        run: ./mach build --release
      - name: Package binary
        run: ./mach package --profile release
      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scoreboard-binary
          path: target/release/servo-tech-demo.tar.gz
          if-no-files-found: error

  wpt:
    needs: [setup, build]
    runs-on: ubuntu-22.04
    # A shard is expected to take 20-35 minutes plus ~5 of setup. 120 caps a
    # hung shard well short of the 6 h limit; the others keep going
    # (fail-fast off) and the page marks the missing one.
    timeout-minutes: 120
    permissions:
      actions: write
    strategy:
      fail-fast: false
      matrix:
        chunk_id: ${{ fromJSON(needs.setup.outputs.chunks) }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523
        with:
          tool-cache: false
          large-packages: false
          swap-storage: false
      - name: Checkout legatus (the built commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Bootstrap dependencies
        timeout-minutes: 30
        run: |
          sudo apt update
          ./mach bootstrap --yes --skip-lints --skip-nextest
          # FIXME #41043, #41044
          sudo apt install -qy --no-install-recommends mesa-vulkan-drivers fonts-noto-cjk fonts-dejavu-extra
          # FIXME #35029
          sudo apt purge -y fonts-droid-fallback
      - name: Download binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scoreboard-binary
      - name: Unpack binary
        run: tar -xzf servo-tech-demo.tar.gz
      - name: Run WPT shard
        timeout-minutes: 105
        # Unquoted on purpose: validated in setup (path chars only), and the
        # subsets must word-split into separate test paths.
        # shellcheck disable=SC2086
        env:
          WPT_SUBSETS: ${{ needs.setup.outputs.subsets }}
          CHUNK_COUNT: ${{ needs.setup.outputs.count }}
          CHUNK_ID: ${{ matrix.chunk_id }}
        # The scoreboard measures; it does not gate. mach exits 1 whenever any
        # result differs from upstream's expectation files, which the fork's
        # own improvements always cause. --always-succeed zeroes only that
        # test-result code (harness exceptions still fail), and the shard
        # must still have written a report with results.
        run: |
          nproc=$(nproc)
          report="wptreport-$CHUNK_ID.json"
          # mach's wpt wrapper defaults to id_hash chunking, which spreads
          # tests evenly across shards regardless of directory size.
          ./mach test-wpt \
            --bin servo/servoshell \
            --release --headless --always-succeed \
            --processes "$nproc" --timeout-multiplier 2 \
            --total-chunks "$CHUNK_COUNT" --this-chunk "$CHUNK_ID" \
            --log-wptreport "$report" \
            $WPT_SUBSETS
          python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("results") else "empty WPT report: " + sys.argv[1])' "$report"
      - name: Upload shard report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: wptreport-${{ matrix.chunk_id }}
          path: wptreport-${{ matrix.chunk_id }}.json
          if-no-files-found: error

  scoreboard:
    needs: [setup, build, wpt]
    # No build means no WPT reports: skip instead of failing on an empty set.
    # Partial shard failures after a good build still publish what ran, and
    # the page lists the shards that produced no usable report.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout main (generator)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: scoreboard
          sparse-checkout-cone-mode: false
      - name: Download shard reports
        # A real download failure stays fatal; an empty report set (every
        # shard died before writing one) is a clean skip in the next step.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wptreport-*
          merge-multiple: true
          path: wpt-logs
      - name: Check for shard reports
        id: reports
        run: |
          if compgen -G "wpt-logs/*.json" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No WPT shard reports; skipping scoreboard generation and publish."
          fi
      - name: Fetch scoreboard history
        if: ${{ steps.reports.outputs.found == 'true' }}
        run: |
          mkdir -p hist
          if git fetch origin scoreboard --depth 30; then
            git archive FETCH_HEAD data | tar -x -C hist || true
          else
            echo "no scoreboard branch yet; starting history"
          fi
      - name: Scorer unit tests
        if: ${{ steps.reports.outputs.found == 'true' }}
        run: python3 -m unittest discover -s scoreboard -p 'test_*.py'
      - name: Generate data + page
        if: ${{ steps.reports.outputs.found == 'true' }}
        env:
          # The legatus commit the build job built and the shards tested.
          FORK_SHA: ${{ needs.build.outputs.sha }}
          EXPECTED_SHARDS: ${{ needs.setup.outputs.count }}
        run: |
          DATE=$(date -u +%F)
          mkdir -p site/data
          python3 scoreboard/generate.py \
            --date "$DATE" \
            --fork-sha "$FORK_SHA" \
            --reports wpt-logs/*.json \
            --expected-shards "$EXPECTED_SHARDS" \
            --history-dir hist \
            --out-data "site/data/$DATE.json" \
            --out-gaps "site/data/$DATE-gaps.json" \
            --out-html site/index.html
          echo "DATE=$DATE" >> "$GITHUB_ENV"
      - name: Publish to scoreboard branch
        if: ${{ steps.reports.outputs.found == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The generator checkout above is sparse; publish needs the full tree.
          git sparse-checkout disable
          if git fetch origin scoreboard; then
            git checkout -B scoreboard FETCH_HEAD
          else
            git checkout --orphan scoreboard
            git rm -rf . || true
          fi
          mkdir -p data
          cp "site/data/$DATE.json" "site/data/$DATE-gaps.json" data/
          cp site/index.html index.html
          git add "data/$DATE.json" "data/$DATE-gaps.json" index.html
          git commit -m "scoreboard: $DATE" || echo "nothing to commit"
          git push origin scoreboard
